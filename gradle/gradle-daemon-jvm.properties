# The JVM the Gradle daemon itself runs on, which is a separate question from jvmToolchain(25).
# The toolchain governs compilation and jvmTest; Compose Desktop's `run` task does not go through
# it — it forks the app on the daemon's own JVM. With the daemon left on whatever Java happens to
# be first on PATH, `./gradlew :flow:run` starts and dies immediately on the classes it just
# compiled ("has been compiled by a more recent version of the Java Runtime").
#
# Written by hand rather than by `./gradlew updateDaemonJvm`, which needs a toolchain download
# repository configured; a locally installed JDK 25 is found by Gradle's own auto-detection.
toolchainVersion=25
