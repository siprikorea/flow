name: Build

# Every push runs the tests. A push to main or a v* tag also builds the app and
# publishes it to siprikorea/flow, the public download repo — but only after the
# tests in this same job have passed, so a red build never ships.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The deploy steps below are the ones guarded by this; a PR or a topic branch
  # runs the tests and stops there.
  DEPLOY: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
  # Where the built app is published. Not this repo — the source stays private.
  TARGET_REPO: siprikorea/flow
  # Written as a prefix so each call reads `$PIN_JDK="$JAVA_HOME"` — see the build step.
  PIN_JDK: >-
    -Porg.gradle.java.installations.auto-detect=false
    -Porg.gradle.java.installations.paths

jobs:
  build:
    # macOS because the .dmg can only be built here, and because it is the OS the
    # tests are written on: the view tests start real JVMs and load Skiko.
    #
    # Self-hosted: a Mac of our own, registered to this repo. GitHub's macOS runners
    # bill at ten times the rate of Linux ones, and a day of releases exhausted the
    # allowance — after which a job is refused before it starts, with no runner, no
    # steps, and nothing to read. A self-hosted runner costs nothing and leaves the
    # release path as it is: push a tag, get a release.
    #
    # It has to be awake when a tag is pushed. If it is not, or if that Mac is gone,
    # put `macos-latest` back here — everything below runs on either.
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - uses: actions/checkout@v7

      # JetBrains Runtime, deliberately: it is the JVM jpackage bundles into the .dmg, and the app
      # has code that only runs on it. Main.kt asks JBR for a CustomTitleBar so the native traffic
      # lights centre on the title bar's real height; on a stock JDK that call returns nothing and
      # AWT places them itself, higher and tighter into the corner. Every release up to v1.8.5
      # shipped Temurin, so that code had never actually run for anyone.
      #
      # It is also what Compose Desktop is developed against.
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # Two steps, because the tests read the extension jars off disk: a single
      # `build` may run :flow:jvmTest before the jar it looks for exists.
      #
      # If this fails with "Cannot find a Java installation ... matching
      # {languageVersion=25}" right after a run of "Invalid Java installation
      # found at ...", nothing is wrong with the JDK: setup-java installed it and
      # JAVA_HOME points at it. Gradle's first probe of the installations on a
      # cold daemon failed, and as it says, it re-checks on the next build — a
      # re-run of the job goes green without a change. Only go looking if a
      # re-run fails the same way.
      #
      # $PIN_JDK on every call: Gradle's toolchain asks for language version 25 from any vendor, and
      # a self-hosted Mac has more than one — v1.9.0 shipped a JBR that Gradle found because
      # IntelliJ had installed it, which was the right runtime by luck rather than by choice. These
      # two options say: the JDK setup-java just installed, and nothing else that happens to be on
      # the machine.
      - name: Build every module
        run: ./gradlew assemble --stacktrace $PIN_JDK="$JAVA_HOME"

      - name: Test
        run: ./gradlew build --stacktrace $PIN_JDK="$JAVA_HOME"

      - name: Keep the test report on a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

      # mcpbBundle verifies itself on the way out: it drives the staged server over
      # stdio and requires the tool list back, so a bundle short a jar fails here.
      - name: Package the app and the Claude Desktop bundle
        if: env.DEPLOY == 'true'
        run: |
          set -euo pipefail
          # a v* tag names the version both carry, so v1.2.3 ships Flow-1.2.3.dmg and
          # a bundle whose manifest says 1.2.3; a main build keeps what the source declares
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew :flow:packageDmg :flow:mcpbBundle -PflowVersion="${GITHUB_REF#refs/tags/v}" --stacktrace $PIN_JDK="$JAVA_HOME"
          else
            ./gradlew :flow:packageDmg :flow:mcpbBundle --stacktrace $PIN_JDK="$JAVA_HOME"
          fi

          # What ends up inside the .dmg is the toolchain's JVM, so this is where a silent change of
          # runtime would show — and the app's title bar depends on which one it is.
          runtime=flow/build/compose/binaries/main/app/Flow.app/Contents/runtime/Contents/Home/bin/java
          "$runtime" -version 2>&1 | head -2
          "$runtime" -version 2>&1 | grep -qi "JBR" || {
            echo "the packaged runtime is not JetBrains Runtime — see the setup-java step"
            exit 1
          }

      - name: Collect what gets published
        if: env.DEPLOY == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          # newest first, so the file just built is the one that ships
          dmg=$(ls -t flow/build/compose/binaries/main/dmg/*.dmg 2>/dev/null | head -1)
          test -n "$dmg" || { echo "no .dmg was built"; exit 1; }
          cp "$dmg" dist/
          # the Claude Desktop extension bundle
          cp flow/build/flow.mcpb dist/
          # the extension jars, each installable on its own from the app
          cp flow-modules/*/build/libs/*.jar dist/
          # the registry manifest the app's Extensions screen reads by default (DEFAULT_REGISTRY_URL),
          # checked against the jars actually built so a stale entry — or a jar with none — fails the
          # build instead of shipping a manifest that doesn't match what's in the release
          built=$(cd flow-modules && ls */build/libs/*.jar | xargs -n1 basename | sort)
          listed=$(jq -r '.extensions[].file' flow-modules/registry.json | sort)
          if [[ "$built" != "$listed" ]]; then
            echo "flow-modules/registry.json is out of sync with the built jars:"
            diff <(echo "$listed") <(echo "$built") || true
            exit 1
          fi
          cp flow-modules/registry.json dist/extensions.json
          ls -lh dist

      # A repo's own GITHUB_TOKEN cannot write to another repo, so this needs a
      # personal access token with `contents: write` on siprikorea/flow, stored
      # here as the FLOW_RELEASE_TOKEN secret.
      #
      # Python rather than the GitHub CLI: a self-hosted runner is somebody's Mac and
      # `gh` is not on it, so a build could finish and then fail on the upload alone.
      # The script needs nothing but the standard library — and, unlike a shell
      # one-liner, it can be run with --dry-run before it is trusted with a release.
      - name: Publish to ${{ env.TARGET_REPO }}
        if: env.DEPLOY == 'true'
        env:
          FLOW_RELEASE_TOKEN: ${{ secrets.FLOW_RELEASE_TOKEN }}
        run: python3 .github/scripts/publish_release.py dist
